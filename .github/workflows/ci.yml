name: Canary CI Pipeline

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: caominhquang1604/canary-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # =============================
    # 1. Checkout source
    # =============================
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # =============================
    # 2. Set image tag = commit SHA
    # =============================
    - name: Set image tag
      run: |
        echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

    # =============================
    # 3. Login Docker Hub
    # =============================
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_PASS }}

    # =============================
    # 4. Build & push Docker image
    # =============================
    - name: Build and push Docker image
      run: |
        docker build -t $IMAGE_NAME:$IMAGE_TAG ./app
        docker push $IMAGE_NAME:$IMAGE_TAG

    # =============================
    # 5. Update CANARY tag only
    # =============================
    - name: Update canary image tag in Helm values
      run: |
        echo "Before:"
        grep -n "canary:" -A3 canary-chart/values.yaml

        sed -i "/canary:/,/tag:/ s|tag:.*|tag: \"$IMAGE_TAG\"|" canary-chart/values.yaml

        echo "After:"
        grep -n "canary:" -A3 canary-chart/values.yaml

    # =============================
    # 6. Commit & push Helm change
    # =============================
    - name: Commit and push Helm update
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"

        git status
        git diff

        git add canary-chart/values.yaml
        git commit -m "ci: update canary image tag to $IMAGE_TAG"
        git push origin main
