name: Canary CI Pipeline

on:
  push:
    branches: [ main ]

env:
  IMAGE: caominhquang1604/canary-app
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set tag
      run: echo "TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

    - name: Login DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_PASS }}

    - name: Build & push canary image
      run: |
        docker build --build-arg VERSION=$TAG -t $IMAGE:canary-$TAG -t $IMAGE:$TAG ./app
        docker push $IMAGE:canary-$TAG
        docker push $IMAGE:$TAG

    - name: Update canary tag in Helm values
      run: |
        cat > canary-chart/values.yaml << EOF
        replicaCount: 2

        image:
          repository: $IMAGE
          tag: "canary-$TAG"
        
        canary:
          enabled: true
        EOF

    - name: Commit and push
      run: |
        git config user.name github-actions
        git config user.email github-actions@github.com
        git add canary-chart/values.yaml
        git commit -m "ci: deploy canary version $TAG" || true
        git push

    - name: Wait for canary analysis
      run: |
        echo "Waiting for Flagger canary analysis..."
        echo "Check canary status with: kubectl get canary -n default"
