apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: canary-app
  namespace: default
spec:
  provider: istio

  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: canary-app-canary

  service:
    port: 80
    gateways:
    - canary-gateway

  analysis:
    interval: 30s
    threshold: 5
    maxWeight: 50
    stepWeight: 10

    metrics:
    - name: request-success-rate
      thresholdRange:
        min: 99
      interval: 30s

    - name: request-duration
      thresholdRange:
        max: 500
      interval: 30s
